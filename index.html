        async function init() {
            try {
                const res = await fetch(API_URL + "?_ts=" + Date.now());
                attendanceRecord = await res.json();
                document.getElementById('sync-text').innerText = "ออนไลน์";
            } catch(e) { document.getElementById('sync-text').innerText = "ออฟไลน์"; }
            
            updateRoomButtons();
            renderStudents();
        }

        function renderStudents() {
            const tbody = document.getElementById('student-list-tbody');
            tbody.innerHTML = '';
            studentData[currentGrade][currentRoom].forEach(s => {
                tbody.innerHTML += `<tr><td class="p-4">${s.name}</td>
                <td class="p-4">
                    <button onclick="saveStatus('${s.id}', 'present')" class="bg-green-500 text-white px-2 rounded">มา</button>
                </td></tr>`;
            });
        }

        async function saveStatus(id, status) {
            attendanceRecord.morning[id] = status;
            await fetch(API_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: new URLSearchParams({ payload: JSON.stringify({ date: new Date().toISOString().slice(0, 10), records: attendanceRecord }) }) 
            });
            renderStudents();
        }

        function updateRoomButtons() { /* เหมือนเดิม */ }

        // สั่งให้เริ่มทำงานเมื่อ HTML โหลดเสร็จเท่านั้น
        window.onload = init;
