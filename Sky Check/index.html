            </div>
        </div>
        
        <div class="bg-white border-b border-slate-100 flex flex-col sm:flex-row justify-between max-w-5xl mx-auto px-4 items-center gap-2 py-2 sm:py-0">
            <div class="flex gap-4 w-full sm:w-auto justify-center sm:justify-start">

                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="py-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-slate-600 font-medium text-sm transition-all">📊 แดชบอร์ดครู</button>
            </div>
            
            <div class="flex items-center gap-3 pb-2 sm:pb-0">

        async function init() {
            setSyncStatus('loading');
            
            const savedStr = localStorage.getItem('colorSportsAttendance');
            if (savedStr) {
                const saved = JSON.parse(savedStr);
                if (saved.date === todayDate) {
                    attendanceRecord = saved.records;
                } else {
                    localStorage.removeItem('colorSportsAttendance');
                    attendanceRecord = { morning: {}, evening: {} };
                }
            }

            try {
                const response = await fetch(API_URL + "?date=" + todayDate);
                const data = await response.json();
                
                if (Object.keys(data.morning || {}).length > 0 || Object.keys(data.evening || {}).length > 0) {
                    attendanceRecord = data;
                    localStorage.setItem('colorSportsAttendance', JSON.stringify({ date: todayDate, records: attendanceRecord }));
                }
                setSyncStatus('online');
            } catch (error) {
                setSyncStatus('offline');
            }
            
            updateRoomButtons();
            renderStudents();
            calculateStats();
            renderDashboard();
            
            setInterval(fetchLatestData, 25000);
        }

        async function fetchLatestData() {
            if(isSyncing) return;
            try {
                const response = await fetch(API_URL + "?date=" + todayDate);
                const data = await response.json();
                attendanceRecord = data;
                localStorage.setItem('colorSportsAttendance', JSON.stringify({ date: todayDate, records: attendanceRecord }));
                renderStudents();
                calculateStats();
                if (currentTab === 'dashboard') renderDashboard();
                setSyncStatus('online');
            } catch(e) {
                setSyncStatus('offline');
            }
        }

        async function saveData() {
            localStorage.setItem('colorSportsAttendance', JSON.stringify({ date: todayDate, records: attendanceRecord }));
            isSyncing = true;
            setSyncStatus('syncing');
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ date: todayDate, records: attendanceRecord })
                });
                setSyncStatus('online');
            } catch (error) {
                setSyncStatus('offline');
            } finally {
                isSyncing = false;
            }
        }

        function setSyncStatus(status) {
            if(status === 'loading') {
                elements.syncStatus.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
                elements.syncText.innerText = "กำลังเชื่อมต่อ...";
            } else if (status === 'syncing') {
                elements.syncStatus.className = "w-2 h-2 rounded-full bg-blue-500 animate-pulse";
                elements.syncText.innerText = "กำลังเซฟ...";
            } else if (status === 'online') {
                elements.syncStatus.className = "w-2 h-2 rounded-full bg-emerald-500";
                elements.syncText.innerText = "ออนไลน์ (ซิงค์ล่าสุดแล้ว)";
            } else {
                elements.syncStatus.className = "w-2 h-2 rounded-full bg-rose-500";
                elements.syncText.innerText = "ออฟไลน์";
            }
        }

            const input = document.getElementById('admin-email-input');
            const authBtn = document.getElementById('auth-btn');
            const badge = document.getElementById('permission-badge');
            if (!isAdmin) {
                if (ADMIN_EMAILS.includes(input.value.trim().toLowerCase())) {
                    isAdmin = true; input.disabled = true; authBtn.innerText = "ออก";
                    authBtn.classList.replace('bg-blue-500', 'bg-red-500');
                    badge.innerText = "⚡ โหมดสตาฟ"; badge.className = "bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-xs font-medium";
                    document.getElementById('reset-room-btn').disabled = false;
                } else alert("❌ อีเมลไม่ถูกต้อง");
            } else {
                isAdmin = false; input.value = ""; input.disabled = false; authBtn.innerText = "ยืนยัน";
                authBtn.classList.replace('bg-red-500', 'bg-blue-500');
                badge.innerText = "👁️ ดูอย่างเดียว"; badge.className = "bg-slate-200 text-slate-600 px-2 py-0.5 rounded text-xs font-medium";
                document.getElementById('reset-room-btn').disabled = true;
            }
            renderStudents();
        }

            document.getElementById('tab-attendance').className = `py-3 px-4 border-b-2 font-medium text-sm transition-all ${tab === 'attendance' ? 'border-blue-500 text-blue-600' : 'border-transparent text-slate-400'}`;

            if (tab === 'dashboard') renderDashboard();

        function updateRoomButtons() {
            elements.roomContainer.innerHTML = '';
            const rooms = Object.keys(studentData[currentGrade]);
            if (!rooms.includes(currentRoom)) currentRoom = rooms[0];
            rooms.forEach(room => {
                const btn = document.createElement('button');
                btn.innerText = `ห้อง ${room}`;
                btn.className = `px-4 py-2 rounded-xl text-sm font-medium transition-all ${currentRoom === room ? 'bg-blue-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600'}`;
                btn.onclick = () => { currentRoom = room; updateRoomButtons(); renderStudents(); };
                elements.roomContainer.appendChild(btn);
            });
        }

        function renderStudents() {
            elements.studentListTbody.innerHTML = '';
            elements.currentViewTitle.innerText = `${elements.gradeSelect.options[elements.gradeSelect.selectedIndex].text} ห้อง ${currentRoom}`;
            const students = studentData[currentGrade][currentRoom] || [];
            students.forEach(student => {
                const status = attendanceRecord[currentTimePeriod][student.id] || '';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 px-6 text-center text-slate-400">${student.no}</td>
                    <td class="py-3 px-6 font-medium text-slate-700">${student.name}</td>
                    <td class="py-3 px-6 text-center">
                        <div class="inline-flex bg-slate-100 p-1 rounded-xl gap-1">
                            <button ${!isAdmin ? 'disabled' : ''} onclick="setStatus('${student.id}', 'present')" class="px-3 py-1 rounded-lg text-xs font-medium transition-all ${!isAdmin ? 'opacity-40 cursor-not-allowed' : ''} ${status === 'present' ? 'bg-emerald-500 text-white' : 'text-slate-500'}">มา</button>
                            <button ${!isAdmin ? 'disabled' : ''} onclick="setStatus('${student.id}', 'leave')" class="px-3 py-1 rounded-lg text-xs font-medium transition-all ${!isAdmin ? 'opacity-40 cursor-not-allowed' : ''} ${status === 'leave' ? 'bg-amber-500 text-white' : 'text-slate-500'}">ลา</button>
                            <button ${!isAdmin ? 'disabled' : ''} onclick="setStatus('${student.id}', 'absent')" class="px-3 py-1 rounded-lg text-xs font-medium transition-all ${!isAdmin ? 'opacity-40 cursor-not-allowed' : ''} ${status === 'absent' ? 'bg-rose-500 text-white' : 'text-slate-500'}">ขาด</button>
                        </div>
                    </td>`;
                elements.studentListTbody.appendChild(tr);
            });
        }

        function setStatus(id, status) {
            if (!isAdmin) return;
            if (attendanceRecord[currentTimePeriod][id] === status) delete attendanceRecord[currentTimePeriod][id];
            else attendanceRecord[currentTimePeriod][id] = status;
            saveData(); renderStudents(); calculateStats();
        }

        function calculateStats() {
            let t=0, p=0, l=0, a=0;
            Object.keys(studentData).forEach(g => Object.keys(studentData[g]).forEach(r => t += studentData[g][r].length));
            Object.values(attendanceRecord[currentTimePeriod]).forEach(s => { if(s==='present') p++; if(s==='leave') l++; if(s==='absent') a++; });
            elements.totalStudents.innerText = t; elements.totalPresent.innerText = p; elements.totalLeave.innerText = l; elements.totalAbsent.innerText = a;
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid'); grid.innerHTML = '';
            const gradeLabels = { 'm1': 'ม.1', 'm2': 'ม.2', 'm3': 'ม.3', 'm4': 'ม.4', 'm5': 'ม.5', 'm6': 'ม.6' };
            Object.keys(studentData).forEach(grade => {
                Object.keys(studentData[grade]).forEach(room => {
                    const students = studentData[grade][room];
                    let t = students.length, p = 0, l = 0, a = 0;
                    students.forEach(s => { const st = attendanceRecord[currentTimePeriod][s.id]; if(st==='present') p++; if(st==='leave') l++; if(st==='absent') a++; });
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 cursor-pointer";
                    card.onclick = () => openRoomDetails(grade, room, students);
                    card.innerHTML = `<h3 class="text-lg font-bold text-slate-700">${gradeLabels[grade]} / ${room}</h3><p class="text-xs mb-4 text-slate-400">ค้างเช็ค ${t-(p+l+a)} คน</p>
                    <div class="grid grid-cols-3 gap-2 text-center text-xs">
                        <div class="bg-emerald-50 text-emerald-600 rounded-xl py-2"><div>มา</div><div class="font-bold">${p}</div></div>
                        <div class="bg-amber-50 text-amber-600 rounded-xl py-2"><div>ลา</div><div class="font-bold">${l}</div></div>
                        <div class="bg-rose-50 text-rose-500 rounded-xl py-2"><div>ขาด</div><div class="font-bold">${a}</div></div>
                    </div>`;
                    grid.appendChild(card);
                });
            });
        }

        function openRoomDetails(grade, room, students) {
            const mContent = document.getElementById('modal-content');
            const gradeLabels = { 'm1': 'มัธยมศึกษาปีที่ 1', 'm2': 'มัธยมศึกษาปีที่ 2', 'm3': 'มัธยมศึกษาปีที่ 3', 'm4': 'มัธยมศึกษาปีที่ 4', 'm5': 'มัธยมศึกษาปีที่ 5', 'm6': 'มัธยมศึกษาปีที่ 6' };
            document.getElementById('modal-title').innerText = `รายละเอียดชั้น ${gradeLabels[grade]} ห้อง ${room}`;
            let lists = { p: [], l: [], a: [] };
            students.forEach(s => { const st = attendanceRecord[currentTimePeriod][s.id]; if(st==='present') lists.p.push(s); else if(st==='leave') lists.l.push(s); else if(st==='absent') lists.a.push(s); });

                <div class="border border-rose-100 p-4 bg-rose-50/20 rounded-xl"><h4 class="font-bold text-rose-600">❌ ขาด (${lists.a.length})</h4><ul class="text-xs">${lists.a.map(s=>`<li>เลขที่ ${s.no} - ${s.name}</li>`).join('')}</ul></div>
                <div class="border border-amber-100 p-4 bg-amber-50/20 rounded-xl"><h4 class="font-bold text-amber-600">⚠️ ลา (${lists.l.length})</h4><ul class="text-xs">${lists.l.map(s=>`<li>เลขที่ ${s.no} - ${s.name}</li>`).join('')}</ul></div>
                <div class="border border-emerald-100 p-4 bg-emerald-50/10 rounded-xl"><h4 class="font-bold text-emerald-600">✅ มา (${lists.p.length})</h4><ul class="text-xs">${lists.p.map(s=>`<li>เลขที่ ${s.no} - ${s.name}</li>`).join('')}</ul></div>
            `;

        function closeModal() { document.getElementById('details-modal').classList.add('hidden'); }
        function resetCurrentRoom() { if(isAdmin && confirm('ล้างข้อมูล?')) { studentData[currentGrade][currentRoom].forEach(s => delete attendanceRecord[currentTimePeriod][s.id]); saveData(); renderStudents(); calculateStats(); } }
        
        // ✨ เพิ่มฟังก์ชันดาวน์โหลดไฟล์ Excel (.csv) ด้วยระบบ Blob แบบเสถียร
        function exportToCSV() {
            try {
                let csvContent = "\uFEFFรหัสนักเรียน,เลขที่,ชื่อ-นามสกุล,ระดับชั้น,ห้อง,สถานะ(เช้า),สถานะ(เย็น)\n";
                const statusMap = { 'present': 'มา', 'leave': 'ลา', 'absent': 'ขาด' };
                
                if (!attendanceRecord) attendanceRecord = { morning: {}, evening: {} };
                if (!attendanceRecord.morning) attendanceRecord.morning = {};
                if (!attendanceRecord.evening) attendanceRecord.evening = {};

                const gradeLabels = { 'm1': 'ม.1', 'm2': 'ม.2', 'm3': 'ม.3', 'm4': 'ม.4', 'm5': 'ม.5', 'm6': 'ม.6' };

                Object.keys(studentData).forEach(grade => {
                    Object.keys(studentData[grade]).forEach(room => {
                        studentData[grade][room].forEach(student => {
                            const mStatusRaw = attendanceRecord.morning[student.id];
                            const eStatusRaw = attendanceRecord.evening[student.id];
                            
                            const mStatus = mStatusRaw ? statusMap[mStatusRaw] : "ยังไม่เช็ค";
                            const eStatus = eStatusRaw ? statusMap[eStatusRaw] : "ยังไม่เช็ค";
                            
                            csvContent += `${student.id},${student.no},"${student.name}",${gradeLabels[grade] || grade.toUpperCase()},${room},${mStatus},${eStatus}\n`;
                        });
                    });
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                
                link.setAttribute("href", url);
                link.setAttribute("download", `สรุปเช็คชื่อคณะสี_${new Date().toISOString().slice(0,10)}.csv`);
                link.style.visibility = 'hidden';
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(url);
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการสร้างไฟล์ Excel: " + error.message);
            }
        }

        elements.gradeSelect.addEventListener('change', (e) => { currentGrade = e.target.value; updateRoomButtons(); renderStudents(); });

        init();
    </script>
</body>
</html>
